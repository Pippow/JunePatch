name: Path-Specific Approver Rules

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited, review_requested, review_request_removed]

jobs:
  check-approvers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get changed files
        id: files
        run: |
          # Fetch list of changed files in the PR
          CHANGED_FILES=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files \
            --paginate --jq '.[].filename')
          echo "CHANGED_FILES=$CHANGED_FILES" >> $GITHUB_ENV
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get approvals
        id: approvals
        run: |
          # Fetch unique list of users who approved the PR
          APPROVED_USERS=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews \
            --jq '[.[] | select(.state=="APPROVED") | .user.login] | unique | map(ascii_downcase)')
          echo "APPROVED_USERS=$APPROVED_USERS" >> $GITHUB_ENV
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enforce approval rules
        run: |
          # === Configuration ===
          SPECIAL_PATH="src/Cynthia.Card/src/Cynthia.Card.Common/CardEffects"         # Path that requires strict approval
          REQUIRED_USERS=("The-last-Iris" "Pippow")     # Both users must approve if path is touched
          # =====================

          echo "Changed files: $CHANGED_FILES"
          echo "Approved users: $APPROVED_USERS"

          # Check if PR touches the special path
          NEED_RULE=0
          for f in $CHANGED_FILES; do
            if [[ "$f" == $SPECIAL_PATH* ]]; then
              NEED_RULE=1
              break
            fi
          done

          if [ "$NEED_RULE" -eq 0 ]; then
            echo "✅ No restricted path changed. Skipping extra checks."
            exit 0
          fi

          # Check if any approver has write/admin permission (super-user)
          for u in $(echo "$APPROVED_USERS" | jq -r '.[]'); do
            PERM=$(gh api repos/${{ github.repository }}/collaborators/$u/permission --jq .permission || echo "none")
            if [[ "$PERM" == "admin" || "$PERM" == "write" ]]; then
              echo "✅ Super-user '$u' (permission: $PERM) approved. Merge allowed."
              exit 0
            fi
          done

          # Check that all required users approved
          for u in "${REQUIRED_USERS[@]}"; do
            if ! echo "$APPROVED_USERS" | grep -qi "$u"; then
              echo "❌ Missing approval from required user: $u"
              exit 1
            fi
          done

          echo "✅ All required users approved. Merge allowed."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
